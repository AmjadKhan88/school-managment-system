services:
  db:
    image: postgres:16-alpine
    container_name: school_erp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school_dev_password
      POSTGRES_DB: school_erp
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school_erp"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
